plugins {
    // Pinned to a real stable release, not a moving SNAPSHOT: 1.8-SNAPSHOT resolved to a Loom build
    // whose "unpick" metadata parser predates the format the 1.21.11 Yarn mappings ship
    // (UnsupportedOperationException: Unsupported unpick version), so it could never configure.
    id 'fabric-loom' version '1.17'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        // The dedicated-server run is used by CI as a runtime smoke test: it boots a real
        // Minecraft server with the mod so we can confirm the mixins actually apply in-engine.
        server {
            vmArg "-Djava.awt.headless=true"
        }
    }
}

repositories {
    // Add the Tellus maven here once it is published; the build works without it (soft dependency).
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pure-math unit tests (no Minecraft needed).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
